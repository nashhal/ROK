name: Validate ROCK demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Static app validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          Path("/tmp/rock-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/rock-inline.js

      - name: Check required interface landmarks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          source = Path("index.html").read_text(encoding="utf-8")
          class Parser(HTMLParser):
              pass
          Parser().feed(source)
          required = ['id="nav"', 'id="content"', 'id="modalRoot"', 'id="langBtn"']
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing interface landmarks: " + ", ".join(missing))
          print("HTML parsed; required interface landmarks found.")
          PY
