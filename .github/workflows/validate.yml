name: Validate ROCK demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Static app validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check application JavaScript syntax
        run: node --check assets/app.js

      - name: Check required interface landmarks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          source = Path("index.html").read_text(encoding="utf-8")
          class Parser(HTMLParser):
              pass
          Parser().feed(source)
          required = ['id="nav"', 'id="content"', 'id="modalRoot"', 'id="langBtn"']
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing interface landmarks: " + ", ".join(missing))
          for asset in ("assets/app.css", "assets/app.js"):
              if not Path(asset).is_file():
                  raise SystemExit("Missing asset: " + asset)
          print("HTML parsed; interface landmarks and static assets found.")
          PY
