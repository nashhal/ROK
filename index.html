function addProduct(p){let old=p||{},editing=!!p;formModal(editing?tr('edit'):tr('newProduct'),field(tr('nameAr'),'nameAr','text',old.nameAr,true,false)+field(tr('nameEn'),'nameEn','text',old.nameEn,false,false)+field(tr('sku'),'id','text',old.id||'RK-'+String(Date.now()).slice(-6),true,false)+field(tr('category'),'category','text',old.category||'accessories',true,false)+field(tr('price')+' (SAR)','price','number',old.price||'',true,false)+field(tr('qty'),'stock','number',old.stock||0,true,false)+field(tr('barcode'),'barcode','text',old.barcode,false,false)+field(tr('reorder'),'reorder','number',old.reorder||5,true,false)+field(tr('description'),'description','text',old.description,false,true)+selectField(tr('status'),'active',[['true',tr('active')],['false',tr('inactive')]],String(old.active!==false),true), 'productForm');$('#productForm').dataset.id=old.id||''}
function addOrder(){formModal(tr('newOrder'),field(tr('customerName'),'customer','text','',true,false)+field(tr('phone'),'phone','tel','',true,false)+field(tr('city'),'city','text','',true,false)+field(tr('address'),'address','text','',true,false)+field(tr('total')+' (SAR)','total','number','',true,false)+selectField(tr('method'),'payment',[['bank',tr('bank')],['cod',tr('cod')]],'bank')+selectField(tr('status'),'status',[['new',tr('new')],['processing',tr('processing')],['shipped',tr('shipped')],['delivered',tr('delivered')],['cancelled',tr('cancelled')]],'new')+'<div class="field full"><label>'+tr('paymentStatus')+'</label><div class="notice">'+tr('demoWarning')+'</div></div>','orderForm')}
function act(a,ev){if(a==='close-modal'){if(ev.target.classList.contains('modal-backdrop')||ev.target.closest('.close')||ev.target.matches('[data-act="close-modal"]'))$('#modalRoot').innerHTML='';return}if(a==='toggle-language'){lang=lang==='ar'?'en':'ar';searchTerm='';render();return}if(a.startsWith('page:')){page=a.split(':')[1];searchTerm='';render();return}if(a==='add-product'){addProduct();return}if(a.startsWith('edit-product:')){const p=db.products.find(x=>x.id===a.slice(13));if(p)addProduct(p);return}if(a.startsWith('delete-product:')){let id=a.slice(15);if(confirm(tr('confirmDelete'))){db.products=db.products.filter(p=>p.id!==id);persist();log('delete product',id);render();notify(tr('removed'))}return}if(a==='add-order'){addOrder();return}if(a==='add-purchase'){formModal(tr('newItem'),field(tr('supplier'),'supplier','text','',true,false)+field(tr('product'),'product','text','',true,false)+field(tr('qty'),'qty','number',10,true,false)+field(tr('cost'),'cost','number','',true,false),'purchaseForm');return}if(a==='add-customer'){formModal(tr('newItem'),field(tr('customerName'),'name','text','',true,false)+field(tr('phone'),'phone','tel','',true,false)+field(tr('city'),'city','text','',true,false),'customerForm');return}if(a==='add-courier'){formModal(tr('newItem'),field(tr('customerName'),'name','text','',true,false)+field(tr('phone'),'phone','tel','',true,false)+field(tr('city'),'city','text','',true,false),'courierForm');return}if(a==='add-promotion'){formModal(tr('newItem'),field(tr('customerName'),'name','text','',true,false)+field(tr('amount'),'value','text','',true,false)+field(tr('date'),'period','text','',false,false),'promoForm');return}if(a==='add-support'){formModal(tr('newItem'),field(tr('customerName'),'name','text','',true,false)+field(tr('module'),'subject','text','',true,false)+field(tr('description'),'body','text','',true,true),'supportForm');return}if(a==='adjust-stock'){formModal(tr('adjust'),selectField(tr('product'),'id',db.products.map(p=>[p.id,p.nameAr]),db.products[0]?.id||'',true)+field(tr('qty'),'qty','number','',true,false)+field(tr('description'),'reason','text','',true,true),'stockForm');return}if(a.startsWith('adjust-one:')){let p=db.products.find(x=>x.id===a.slice(11));if(p){formModal(tr('adjust')+' · '+esc(p.nameAr),field(tr('qty'),'qty','number',p.stock,true,false)+field(tr('reorder'),'reorder','number',p.reorder,true,false),'stockForm');$('#stockForm').dataset.product=p.id}return}if(a.startsWith('order-detail:')||a.startsWith('invoice:')){let id=a.substring(a.indexOf(':')+1),o=db.orders.find(x=>x.id===id);if(o)modal(tr('invoiceTitle')+' · '+o.id,'<div id="printArea"><p><b>ROCK</b> · '+tr('demoData')+'</p><p>'+tr('customerName')+': '+esc(o.customer)+'</p><p>'+tr('phone')+': '+esc(o.phone)+'</p><p>'+tr('city')+': '+esc(o.city)+'</p><p>'+tr('date')+': '+date(o.date)+'</p><hr><p>'+tr('total')+': <b>'+money(o.total)+'</b></p><p>'+tr('paymentStatus')+': '+tr(o.paymentStatus==='paid'?'paid':'pending')+'</p><p style="font-size:11px;color:#778">'+tr('demoWarning')+'</p></div><button class="btn primary" onclick="window.print()">'+tr('print')+'</button>');return}if(a.startsWith('change-status:')){let o=db.orders.find(x=>x.id===a.slice(13));if(o){formModal(tr('status')+' · '+o.id,selectField(tr('status'),'status',[['new',tr('new')],['review',tr('review')],['processing',tr('processing')],['shipped',tr('shipped')],['delivered',tr('delivered')],['cancelled',tr('cancelled')]],o.status,true)+selectField(tr('paymentStatus'),'paymentStatus',[['pending',tr('pending')],['paid',tr('paid')]],o.paymentStatus),'statusForm');$('#statusForm').dataset.order=o.id}return}if(a.startsWith('toggle-payment:')){let o=db.orders.find(x=>x.id===a.slice(14));if(o){if(confirm(tr('confirmDelete'))){o.paymentStatus=o.paymentStatus==='paid'?'pending':'paid';persist();log('change payment demo',o.id);render()}}return}if(a.startsWith('receive:')){let p=db.purchases.find(x=>x.id===a.slice(8));if(p){p.status='received';let item=db.products.find(x=>x.nameAr===p.product||x.nameEn===p.product);if(item)item.stock+=Number(p.qty)||0;persist();log('receive purchase',p.id);render();notify(tr('stockAdded'))}return}if(a==='backup'){download('rock-demo-backup.json',JSON.stringify({version:1,generatedAt:new Date().toISOString(),data:db},null,2),'application/json');return}if(a==='reset'){if(confirm(tr('resetConfirm'))){db=seed();persist();log('reset demo','all');page='home';render()}return}if(a.startsWith('export:')){let key=a.slice(7),data=db[key]||[];if(!Array.isArray(data)){if(key==='inventory')data=db.products.map(p=>({id:p.id,name:p.nameAr,stock:p.stock,reorder:p.reorder}));else data=[]}download('rock-'+key+'-demo.csv',csv(data),'text/csv;charset=utf-8');return}}
function csv(data){if(!data.length)return '\uFEFF';let keys=[...new Set(data.flatMap(x=>Object.keys(x)))];return '\uFEFF'+[keys.join(','),...data.map(o=>keys.map(k=>'"'+String(o[k]??'').replace(/"/g,'""').replace(/\n/g,' ')+'"').join(','))].join('\r\n')}
function download(name,data,type){let blob=new Blob([data],{type:type||'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restoreFile(e){let f=e.target.files&&e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);db=x.data||x;if(!db.products||!db.orders)throw new Error('bad');persist();render();notify(tr('updated'))}catch(e){notify('JSON غير صالح')}};r.readAsText(f)}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;searchTerm='';render();$('#sidebar').classList.remove('open');return}const b=e.target.closest('[data-act]');if(b){e.preventDefault();act(b.dataset.act,e)}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.id.endsWith('Form'))return;e.preventDefault();const d=Object.fromEntries(new FormData(f).entries());const num=x=>Number(d[x]||0);if(f.id==='productForm'){if(!d.nameAr.trim()||!d.id.trim()){notify(tr('nameRequired'));return}let obj={id:d.id.trim(),nameAr:d.nameAr.trim(),nameEn:d.nameEn.trim()||d.nameAr.trim(),category:d.category||'accessories',price:num('price'),stock:num('stock'),barcode:d.barcode||'',reorder:num('reorder'),description:d.description||'',active:d.active!=='false'};let ix=db.products.findIndex(p=>p.id===f.dataset.id);if(ix>=0)db.products[ix]=obj;else db.products.unshift(obj);log(ix>=0?'edit product':'add product',obj.id);persist();$('#modalRoot').innerHTML='';render();notify(tr('updated'))}
else if(f.id==='orderForm'){db.orders.unshift({id:'ROK-'+String(Date.now()).slice(-6),customer:d.customer,phone:d.phone,city:d.city,address:d.address,total:num('total'),status:d.status,payment:d.payment,paymentStatus:'pending',date:new Date().toISOString(),items:''});log('create order demo',d.customer);persist();$('#modalRoot').innerHTML='';page='orders';render();notify(tr('orderSaved'))}
else if(f.id==='purchaseForm'){db.purchases.unshift({id:'PO-'+String(Date.now()).slice(-5),supplier:d.supplier,product:d.product,qty:num('qty'),cost:num('cost'),status:'ordered',date:new Date().toISOString()});log('create purchase demo',d.supplier);persist();$('#modalRoot').innerHTML='';render();notify(tr('updated'))}
else if(f.id==='customerForm'){db.customers.push({name:d.name,phone:d.phone,city:d.city,orders:0});log('add customer demo',d.name);persist();$('#modalRoot').innerHTML='';render();notify(tr('updated'))}
else if(f.id==='courierForm'){db.couriers.push({name:d.name,phone:d.phone,city:d.city,active:true});log('add courier demo',d.name);persist();$('#modalRoot').innerHTML='';render();notify(tr('updated'))}
else if(f.id==='promoForm'){db.promotions.push({name:d.name,value:d.value,period:d.period});log('create promotion demo',d.name);persist();$('#modalRoot').innerHTML='';render();notify(tr('updated'))}
else if(f.id==='supportForm'){db.support.push({name:d.name,subject:d.subject,body:d.body,date:new Date().toISOString()});log('customer support demo',d.subject);persist();$('#modalRoot').innerHTML='';render();notify(tr('updated'))}
else if(f.id==='stockForm'){let p=db.products.find(x=>x.id===(f.dataset.product||d.id));if(p){if(f.dataset.product){p.stock=num('qty');p.reorder=num('reorder')}else{p.stock+=num('qty');db.audit.unshift({action:'stock adjustment',record:p.id+' / '+d.reason,at:new Date().toISOString()})}log('stock update demo',p.id);persist()}$('#modalRoot').innerHTML='';render();notify(tr('stockAdded'))}
else if(f.id==='statusForm'){let o=db.orders.find(x=>x.id===f.dataset.order);if(o){o.status=d.status;o.paymentStatus=d.paymentStatus||o.paymentStatus;log('change order status demo',o.id);persist()}$('#modalRoot').innerHTML='';render();notify(tr('statusChanged'))}});
$('#langBtn').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';searchTerm='';render()});$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));render();
})();
</script>
